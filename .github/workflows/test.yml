name: test

# Same suite as dev/bin/release-checks. Linux runs the non-UTF-8 path round
# trip that macOS (APFS) skips.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q -rs
        working-directory: skills/run-agoge/scripts
